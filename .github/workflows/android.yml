name: Android
on:
  push:
    branches: [main, feature/mobile-platforms]
    paths: ["VERSION", "android/**", "native/**", "scripts/android-torrent-libs.sh", "scripts/build-ffmpeg.sh", ".github/workflows/android.yml"]
  pull_request:
    paths: ["VERSION", "android/**", "native/**", "scripts/android-torrent-libs.sh", "scripts/build-ffmpeg.sh", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Native build tools
        timeout-minutes: 15
        run: |
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf >/dev/null
          for try in 1 2 3; do
            timeout 120 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq ninja-build pkg-config autoconf automake libtool && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-android-${{ hashFiles('native/vcpkg.json', 'native/triplets/**', 'native/src/**', 'native/include/**') }}
          restore-keys: native-android-
      - name: Torrent engine for Android
        run: bash scripts/android-torrent-libs.sh arm64 arm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg-android
        with:
          path: .ffmpeg-cache/android
          key: ffmpeg-android-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: FFmpeg for Android (re-packing only, from source)
        run: |
          set -e
          for t in arm64:arm64-v8a arm:armeabi-v7a; do
            a=${t%%:*}; abi=${t#*:}; c=.ffmpeg-cache/android/$abi
            [ -f "$c/libffmpeg.so" ] || bash scripts/build-ffmpeg.sh android-$a "$c"
            mkdir -p android/app/src/main/jniLibs/$abi && cp "$c"/libffmpeg.so "$c"/libffprobe.so android/app/src/main/jniLibs/$abi/
          done
          cp .ffmpeg-cache/android/arm64-v8a/NOTICE-video-tools-1.txt android/app/src/main/assets/licenses/FFmpeg-LGPL-2.1.txt
          ls -la android/app/src/main/jniLibs/*/libff*.so
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Release signing key (only when the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.NDM_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NDM_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Tests
        run: gradle -p android --no-daemon testDebugUnitTest
      - name: Build the APKs
        env:
          NDM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NDM_ANDROID_KEYSTORE_PASSWORD }}
          NDM_ANDROID_KEY_ALIAS: nexonic # not a secret; as a secret GitHub would hide every "nexonic" in the logs
          NDM_ANDROID_KEY_PASSWORD: ${{ secrets.NDM_ANDROID_KEY_PASSWORD }}
        run: |
          # Separately: release builds make one APK per processor type, debug builds one APK for all.
          gradle -p android --no-daemon assembleDebug
          gradle -p android --no-daemon assembleRelease
      - name: Check the APKs
        run: |
          set -e
          mkdir -p out
          DBG=android/app/build/outputs/apk/debug/app-debug.apk
          # Preserve Gradle's automatically signed debug APK for on-device handoff QA.
          # The release APKs below remain unsigned until a release key is configured.
          test -s "$DBG"
          cp "$DBG" out/NexonicDownloadManager-Android-debug.apk
          R=android/app/build/outputs/apk/release
          ls -la $R
          # One release APK per processor type: arm64 (almost every phone) and 32-bit ARM (older phones).
          for abi in arm64-v8a armeabi-v7a; do
            rel=$(ls $R/app-$abi-release*.apk | head -1)
            name=NexonicDownloadManager-Android
            if [ "$abi" = armeabi-v7a ]; then name=$name-32bit; fi
            suffix=""
            if [[ "$rel" == *unsigned* ]]; then suffix=-unsigned; fi
            cp "$rel" "out/$name-release$suffix.apk"
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT="$BT/aapt2"
          # Release builds are shrunk by R8: the video engine's classes that are used by reflection must survive,
          # or the engine fails on phones only (debug builds are not shrunk).
          AN=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/apkanalyzer | head -1)
          REL=$(ls out/NexonicDownloadManager-Android-release*.apk | head -1)
          CLASSES=$("$AN" dex packages --defined-only "$REL")
          for cls in org.apache.commons.compress.archivers.zip.ExtraFieldUtils org.apache.commons.compress.archivers.zip.AsiExtraField \
                     com.yausername.youtubedl_android.YoutubeDL com.yausername.youtubedl_android.mapper.VideoInfo; do
            # The class name is the last column of apkanalyzer's list.
            echo "$CLASSES" | awk '{print $NF}' | grep -qx "$cls" || {
              echo "R8 removed or renamed $cls: the video engine would break"
              echo "$CLASSES" | grep -i "commons\|yausername" | head -5; exit 1; }
          done
          echo "Video engine classes are intact in the release APK."
          if ls out/*release.apk >/dev/null 2>&1; then
            echo "Release APK signature:"
            "$BT/apksigner" verify --verbose --print-certs out/NexonicDownloadManager-Android-release.apk | grep -E "Verified using|Signer #1 certificate DN|SHA-256 digest"
          else
            echo "Release APK is unsigned: set the NDM_ANDROID_* secrets (android/setup-android-signing.sh)."
          fi
          echo "Debug APK signing verification:"
          "$BT/apksigner" verify --verbose "$DBG" | grep -E "Verified using|Number of signers"
          "$AAPT" dump badging $DBG | grep -E "^package|sdkVersion|targetSdk|native-code"
          "$AAPT" dump permissions $DBG
          ls -la out
          sha256sum out/*.apk
      - name: Licenses and bundled components
        run: |
          set -e
          REL=$(ls out/NexonicDownloadManager-Android-release*.apk | head -1)
          # The license screen must ship in every APK.
          for f in NOTICES.txt GPL-3.0.txt Apache-2.0.txt PSF-2.0-Python.txt MIT-Nexonic.txt FFmpeg-LGPL-2.1.txt; do
            unzip -l "$REL" "assets/licenses/$f" >/dev/null || { echo "missing assets/licenses/$f"; exit 1; }
          done
          # Inventory for the third-party notices: Java libraries, and the native files inside the video engine.
          {
            echo "== Runtime libraries"; gradle -p android --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath | grep -E "^[+\\| ]" | sed 's/^[-+\\| ]*//' | sort -u
            echo "== Native files"; T=$(mktemp -d); unzip -q -o "$REL" 'lib/arm64-v8a/*' -d "$T"
            for z in "$T"/lib/arm64-v8a/*.zip.so; do [ -f "$z" ] || continue; echo "-- $(basename "$z")"; unzip -Z1 "$z" | grep -E '\.so(\.|$)|/bin/' | sed 's#.*/##' | sort -u; done
            ls "$T"/lib/arm64-v8a
          } > out/android-components.txt
          cat out/android-components.txt
      - name: GPL source list resolves (the release attaches the full archive)
        run: |
          grep -q 'YTDL_TAG='"$(grep -o 'youtubedlAndroid = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)" scripts/android-gpl-sources.sh \
            || { echo "youtubedl-android version changed: update scripts/android-gpl-sources.sh"; exit 1; }
          DRY=1 bash scripts/android-gpl-sources.sh "$RUNNER_TEMP/gpl" | tail -3
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-reports
          path: android/app/build/reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NexonicDownloadManager-Android
          path: |
            out/*.apk
            out/android-components.txt
  ffmpeg-on-android:
    # The app's FFmpeg is cross-built like the release one (x86_64 here, because the emulator runs it at full speed) and
    # must do on a real Android system what yt-dlp asks of it.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build FFmpeg for Android (x86_64)
        run: bash scripts/build-ffmpeg.sh android-x64 "$RUNNER_TEMP/ff"
      - name: Sample video, audio, subtitles and chapters
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          S="$RUNNER_TEMP/sample" && mkdir -p "$S" && cd "$S"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=160x120:rate=10 -t 4 -c:v libx264 -pix_fmt yuv420p video.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine -t 4 -c:a aac audio.m4a
          printf 'WEBVTT\n\n00:00.000 --> 00:02.000\nHello\n\n00:02.000 --> 00:04.000\nWorld\n' > en.vtt
          printf ';FFMETADATA1\ntitle=Sample\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=0\nEND=2000\ntitle=One\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=2000\nEND=4000\ntitle=Two\n' > chapters.txt
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run it on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/ffmpeg-check.sh "$RUNNER_TEMP/ff" "$RUNNER_TEMP/sample"
